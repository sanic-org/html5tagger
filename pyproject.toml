[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "html5tagger"
dynamic = ["version"]
description = "Pythonic HTML generation/templating (no template files)"
readme = "README.md"
license = { text = "Unlicense" }
authors = [
    { name = "Sanic Community", email = "tronic@noreply.users.github.com" },
]
requires-python = ">=3.10"
keywords = ["HTML", "HTML5", "templating", "Jinja2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "License :: OSI Approved :: MIT License",
    "License :: Public Domain",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sanic-org/html5tagger"
Repository = "https://github.com/sanic-org/html5tagger"
Issues = "https://github.com/sanic-org/html5tagger/issues"

[dependency-groups]
dev = ["nox"]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.14.9",
    "ty>=0.0.7",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = [
    "/html5tagger",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["html5tagger"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
preview = true

[tool.ty.src]
exclude = ["*.ipynb", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["html5tagger"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "except ImportError:",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B018",  # useless expression (html5tagger uses attribute access for side effects)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"html5tagger/html5.py" = ["SIM905"]
"tests/**/*.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["html5tagger"]
